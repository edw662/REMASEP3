name: Corregir exclusiones REMASEP v2

on:
  push:
    paths:
      - '.github/workflows/fix-exclusions-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir filtros
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          block=re.compile(r"  const EXCLUIR_TODOS=\[.*?\n  \];\n  const excluirDeTodos=t=>\{.*?\n  \};", re.S)
          repl="""  const normExcl=s=>norm(s).replace(/[^a-z0-9]+/g,' ').replace(/\\s+/g,' ').trim();
  const EXCLUIR_TODOS=new Set([
    'protesis acrilica','protesis flexible','bracket','braket',
    'ortodoncia montaje','ortodoncia retiro','control ortodoncia',
    'rx','dxrx','dx rx','protesis prueba','abono tto','cont superior',
    'cimentacion','cementacion','blanqueamiento','otro'
  ].map(normExcl));
  const excluirDeTodos=t=>EXCLUIR_TODOS.has(normExcl(t));"""
          s,n=block.subn(repl,s,count=1)
          if n!=1: raise SystemExit('No se pudo reemplazar bloque EXCLUIR_TODOS')

          s,n=re.subn(r"\.filter\(\(\[k\]\)=>!activeTags\.has\(k\)&&\(!query\|\|k\.toLowerCase\(\)\.includes\(query\)\|\|displayTrat\(k\)\.toLowerCase\(\)\.includes\(query\)\)\)",
                    ".filter(([k])=>!excluirDeTodos(k)&&!activeTags.has(k)&&(!query||k.toLowerCase().includes(query)||displayTrat(k).toLowerCase().includes(query)))",s,count=1)
          if n!=1: raise SystemExit('No se pudo ajustar showSug')

          s,n=re.subn(r"    const filtered=allRows\.filter\(r=>activeTags\.has\(r\.tratamiento\)\);",
                    "    [...activeTags].forEach(t=>{if(excluirDeTodos(t))activeTags.delete(t);});\n    const filtered=allRows.filter(r=>activeTags.has(r.tratamiento)&&!excluirDeTodos(r.tratamiento));",s,count=1)
          if n!=1: raise SystemExit('No se pudo ajustar runRemasep')

          if "      if(excluirDeTodos(tag))continue;" not in s:
              s,n=re.subn(r"    for\(const tag of activeTags\)\{\n      const el=document\.createElement\('div'\);",
                        "    for(const tag of activeTags){\n      if(excluirDeTodos(tag))continue;\n      const el=document.createElement('div');",s,count=1)
              if n!=1: raise SystemExit('No se pudo ajustar renderTags')

          p.write_text(s,encoding='utf-8')
          PY

      - name: Guardar corrección
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corregir exclusiones en selección y procesamiento"
          git push
